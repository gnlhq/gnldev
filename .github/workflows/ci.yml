name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Callable so the release workflow can REQUIRE these exact gates instead of restating a subset of
  # them. A `v*` tag push does not match the branch filter above, so before this the publish path ran
  # none of the jobs defined below — the artifact that reached npm had never been tested against a
  # collation-ordered Postgres, which is the only place the bug that matrix exists for can appear.
  # Restating the steps in release.yml would have re-created the drift that caused this: a gate added
  # here is a gate the release does not get.
  #
  # By reference ("the jobs below") rather than enumerated: not every checkout of this file defines the
  # same set, and a list here would name a job the reader cannot find in it.
  workflow_call:

jobs:
  build-test:
    name: typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile only when there is a lockfile to be frozen against. This repository's
      # history starts as a snapshot, and the lockfile is regenerated for the published package set
      # at the tip — so a checkout of an older commit has none, and an unconditional --frozen-lockfile
      # turns every historical revision permanently red for a reason that has nothing to do with it.
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else echo "::notice::no pnpm-lock.yaml at this revision — installing without --frozen-lockfile"
               pnpm install --no-frozen-lockfile; fi
      - run: pnpm -r build
      - run: pnpm -r typecheck
      # `--reporter=junit` alongside the default one, because a flake that is not recorded cannot be
      # fixed. One run of this suite went red with a single failing test and a single unhandled
      # error; the output went to a terminal and was never written down, so the test's name was lost
      # and no later run reproduced it.
      #
      # Note the flags carry WITHOUT `--`. With it, vitest ignores everything after the separator —
      # the suite runs and the XML is never written, which is easy to misread as pnpm dropping them.
      # Written down because the wrong reading costs a working `pretest` hook: `pnpm test` fires it,
      # `pnpm exec vitest` does not.
      #
      # `always()`, not `failure()`: the green runs are the baseline a flake hunt compares against —
      # which test is creeping toward its limit, which one retried — and the XML is free on them.
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: test-results.xml
      # Every ```ts block in every README and doc, compiled against the packages as built. Three
      # review rounds in a row found quickstarts that threw on their first line; a person reading
      # carefully does not scale to 24 READMEs, and this does.
      - run: pnpm check:docs
      # VERSIONING.md promises lockstep; a partial bump ships a mismatched pair silently.
      - run: pnpm check:versions
      # Every error code on the wire has a page under docs/errors. A code is added by the author who
      # knows why it exists; the page has to be written in that same moment, because nobody
      # afterwards has the context. This gate is what makes that moment happen.
      - run: pnpm check:errors
      # Two defects that were found BY HAND during an audit, both invisible to every other gate
      # because neither breaks behaviour: a literal control byte makes `grep` skip a file in silence
      # (a search for a route that exists returned nothing, and the wrong conclusion was drawn), and
      # a package with no `test` script is skipped by `pnpm -r test` with no warning — @gnldev/studio
      # sat that way holding 718 passing tests, the cross-org isolation suite among them.
      - run: pnpm check:hygiene
      # An option a deployment can set and nobody documented: `subjectBinding` closes a
      # cross-subject read and appeared in zero .md files. check:docs verifies what IS written.
      - run: pnpm check:option-docs
      # A misspelled option was dropped without a word in every package (`authorise` left a door without
      # its policy, `isuer` accepted any issuer's token). Each package now refuses a name it does not take,
      # and this holds the rule to every exported options type, function, constructor and method — a new
      # one without the check fails here instead of shipping silent.
      - run: pnpm check:option-names


  integration:
    name: real backend (${{ matrix.pg.label }})
    runs-on: ubuntu-latest
    # Two Postgres string orderings, because the prefix-range fix is invisible under one of them.
    #
    # Every prefix operation is a range `key >= prefix AND key < prefix + U+FFFF`, which is only a
    # prefix under BYTE ordering. postgres:15-alpine initdb's to SQL_ASCII/C -- byte-ordered -- so this
    # job used to pass whether or not the COLLATE "C" fix was present. Managed Postgres (Neon, RDS,
    # Supabase) defaults to en_US.utf8, where U+FFFF is a noncharacter that collates as if absent and
    # the range matches NOTHING: listKeys returns empty and deletePrefix deletes nothing, both
    # reporting success. Measured with the fix reverted:
    #
    #   postgres:15-alpine (SQL_ASCII / C)  -> 33/33 pass   <- the only leg this job used to have
    #   postgres:16 (UTF8 / en_US.utf8)     -> 3 fail, including the GDPR counter sweep
    #
    # So the leg that matters is the second one. Both are kept: C is what a self-hosted alpine user
    # gets, and a fix that assumed a linguistic collation would break them instead.
    strategy:
      fail-fast: false
      matrix:
        pg:
          - label: 'Postgres en_US.utf8'
            image: 'postgres:16'
            # The official Debian image already sets LANG=en_US.utf8; passed explicitly so an image
            # default change cannot silently move this leg to C and evaporate the coverage.
            initdb: '--locale=en_US.utf8 --encoding=UTF8'
            collation: 'en_US.utf8'
          - label: 'Postgres C'
            image: 'postgres:15-alpine'
            initdb: '--locale=C'
            collation: 'C'
    services:
      postgres:
        image: ${{ matrix.pg.image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: ${{ matrix.pg.initdb }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # A second Postgres with the `vector` extension (docker-compose.yml's `pgvector`), for the stores
      # that need it. Without it and GNL_PGVECTOR_URL, the pgvector tests below skipped themselves on
      # every run and the job said nothing. Not collation-matrixed: the vector contract does no prefix
      # ranges, which is what the two legs exist for.
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GNL_INTEGRATION: '1'
      # integration-real.test.ts reads GNL_PG_URL (audit finding: the old PG_URL name never
      # matched what the test expected -> instead of the job service it connected to the
      # default 55432 and failed with a retry-timeout).
      GNL_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      GNL_PGVECTOR_URL: postgresql://postgres:postgres@localhost:5433/postgres
      # The leg asserts it really got the ordering it was assigned. Without this, POSTGRES_INITDB_ARGS
      # silently not taking effect would leave both legs byte-ordered and the job would report coverage
      # it does not have -- the same failure this matrix exists to fix.
      GNL_PG_EXPECT_COLLATION: ${{ matrix.pg.collation }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile only when there is a lockfile to be frozen against. This repository's
      # history starts as a snapshot, and the lockfile is regenerated for the published package set
      # at the tip — so a checkout of an older commit has none, and an unconditional --frozen-lockfile
      # turns every historical revision permanently red for a reason that has nothing to do with it.
      - run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else echo "::notice::no pnpm-lock.yaml at this revision — installing without --frozen-lockfile"
               pnpm install --no-frozen-lockfile; fi
      # Packages resolve each other through dist/ (main points at ./dist/index.js), so the test
      # cannot even be collected before a build: run.ts imports @gnldev/tool-schema and vite
      # fails with "Failed to resolve entry for package". The typecheck job builds as part of its
      # own flow; this one has to ask for it explicitly.
      - run: pnpm -r build
      # Run from the root: the root vitest.config include is 'packages/*/test/**', so running from
      # inside a package directory reports "No test files found" (a known monorepo quirk).
      #
      # WHICH files: every test that reads GNL_PG_URL, GNL_PG_ADMIN_URL or GNL_PGVECTOR_URL, itself or
      # through a local helper — found by scripts/real-backend-tests.mjs, not listed here. Such a test
      # skips itself without a server, so the default job is green whether it ran or not; this line used
      # to name files by hand and, measured on 12 Oct 2026, 67 real-Postgres tests were named nowhere
      # (test/real-backend-tests-run.test.ts holds this job to the rule). scripts/check-real-backends.mjs
      # runs the same two groups locally.
      #
      # TWO runs, in this order: the `alone` group terminates every backend on the database
      # (integration-real's failover case), and in the same vitest run it reached the other files' open
      # pools (4 uncaught 57P01 errors, a red caused by the schedule, not by any store).
      # --maxWorkers=3: the runner's own default on four cores, written down so a larger machine running
      # the same line (check-real-backends.mjs) does not exceed the server's 100 connections — the
      # multi-process tests open several pools per file.
      - run: node scripts/real-backend-tests.mjs --run alone
      - run: node scripts/real-backend-tests.mjs --run shared -- --maxWorkers=3 --minWorkers=1

  upgrade-from-0-9-0:
    name: upgrade from 0.9.0 (known failures, not yet gating)
    runs-on: ubuntu-latest
    # Opens databases 0.9.0 wrote (packages/upgrade-tests/fixtures/0.9.0) with this code: SQLite files,
    # a Postgres dump, plus a rolling deploy with the published 0.9.0 in a child process.
    # It holds known failures that the fixes after it turn green, so for now a red here does not make the
    # workflow red (and does not block the release, which `needs` every job of this file). Remove
    # `continue-on-error` once it is green: from then on it guards the upgrade like any other gate.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GNL_INTEGRATION: '1'
      GNL_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The published 0.9.0, installed outside the workspace (packages/upgrade-tests/README.md says why
      # it cannot be a workspace dependency while the workspace version is 0.9.0).
      - run: |
          echo "GNL_090_ROOT=$RUNNER_TEMP/gnl-090" >> "$GITHUB_ENV"
          node packages/upgrade-tests/generate/load-0.9.0.mjs "$RUNNER_TEMP/gnl-090"
      - run: pnpm test:legacy --reporter=default --reporter=junit --outputFile.junit=upgrade-results.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: upgrade-results
          path: packages/upgrade-tests/upgrade-results.xml
