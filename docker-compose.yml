# Postgres for the real backend integration test. Using port 55432 to avoid conflicts.
#   docker compose up -d
#   GNL_INTEGRATION=1 pnpm --filter @gnldev/durable exec vitest run test/integration-real.test.ts
#   docker compose down
# `pgvector` is a second Postgres with the `vector` extension, for the stores that need it
# (GNL_PGVECTOR_URL: rag's PostgresVectorStore, the vector write contract). A separate service rather
# than swapping the image of `postgres`, so the durable suite keeps running on the server it always has.
# `mysql` and `mariadb` are the servers MysqlStorage supports; `mongo` the replica set MongoStorage runs on
# (scripts/check-real-backends.mjs initiates it) and `mongo-standalone` the server it must refuse.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: gnl
      POSTGRES_DB: gnl
    ports:
      - '55432:5432'
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: gnl
      POSTGRES_DB: gnl
    ports:
      - '55433:5432'
  # MysqlStorage (`@gnldev/durable/mysql`) on both servers it supports (GNL_MYSQL_URL, GNL_MARIADB_URL),
  # with the short TCP keepalives a deployment needs (packages/durable/README.md, MySQL and MariaDB).
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: gnl
      MYSQL_DATABASE: gnl
    ports:
      - '55306:3306'
    sysctls:
      net.ipv4.tcp_keepalive_time: 10
      net.ipv4.tcp_keepalive_intvl: 5
      net.ipv4.tcp_keepalive_probes: 3
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: gnl
      MARIADB_DATABASE: gnl
    ports:
      - '55307:3306'
    sysctls:
      net.ipv4.tcp_keepalive_time: 10
      net.ipv4.tcp_keepalive_intvl: 5
      net.ipv4.tcp_keepalive_probes: 3
  # MongoStorage (`@gnldev/durable/mongo`): a single-node replica set with access control (a keyfile made in
  # the container), short TCP keepalives and a raised file limit — as packages/durable/README.md says a
  # deployment runs it. GNL_MONGO_URL; GNL_MONGO_STANDALONE_URL for `mongo-standalone`. GLIBC_TUNABLES:
  # MongoDB 8.x does not start on Linux 6.19–7.0.13 otherwise (packages/durable/README.md, MongoDB).
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: gnl
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    entrypoint: ['sh', '-c', 'openssl rand -base64 756 > /tmp/keyfile && chmod 400 /tmp/keyfile && chown mongodb /tmp/keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/keyfile --bind_ip_all']
    ports:
      - '55317:27017'
    ulimits:
      nofile: 64000
    sysctls:
      net.ipv4.tcp_keepalive_time: 10
      net.ipv4.tcp_keepalive_intvl: 5
      net.ipv4.tcp_keepalive_probes: 3
  mongo-standalone:
    image: mongo:8.0
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - '55318:27017'
